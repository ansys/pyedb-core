name: Template Validation

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Check the title of the pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the title of the pull request
        uses: ansys/actions/check-pr-title@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          use-upper-case: true