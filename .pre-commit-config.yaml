repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 0671d8ab202c4ac093b78433ae5baf74f3fc7246
  hooks:
  - id: ruff-check
  - id: ruff-format

- repo: https://github.com/adamchainz/blacken-docs
  rev: fda77690955e9b63c6687d8806bafd56a526e45f
  hooks:
  - id: blacken-docs
    additional_dependencies:
    - black==26.5.1

- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
  hooks:
  - id: codespell
    exclude: (?x)(^notebooks)
    args:
    - --ignore-words
    - doc/styles/config/vocabularies/ANSYS/accept.txt

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace
    exclude: (?x)^(.*\.def)

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: f805888065fdb6162e1f800e50bb9460cbd223d6
  hooks:
  - id: check-github-workflows

- repo: local
  hooks:
  - id: cleanipynb-helpers
    name: cleanipynb-helpers
    language: system
    entry: python scripts/cleanipynb.py
    files: notebooks/helpers/[^/]*\.ipynb$
  - id: cleanipynb
    name: cleanipynb
    language: system
    entry: python scripts/cleanipynb.py
    args:
    - --leave-outputs
    files: notebooks/[^/]*\.ipynb$

- repo: https://github.com/ansys/pre-commit-hooks
  rev: v0.8.0
  hooks:
  - id: add-license-headers
    args:
    - --start_year=2022
