repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 0671d8ab202c4ac093b78433ae5baf74f3fc7246  # frozen: v0.15.15
  hooks:
    - id: ruff-check
    - id: ruff-format

- repo: https://github.com/adamchainz/blacken-docs
  rev: fda77690955e9b63c6687d8806bafd56a526e45f  # frozen: 1.20.0
  hooks:
    - id: blacken-docs
      additional_dependencies: [black==26.5.1]

- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a  # frozen: v2.4.2
  hooks:
    - id: codespell
      exclude: (?x)(^notebooks)
      args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt"]

# Check for common mistakes in various file types
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: check-yaml
    - id: trailing-whitespace
      exclude: (?x)^(.*\.def)

# Validate GitHub workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: f805888065fdb6162e1f800e50bb9460cbd223d6  # frozen: 0.37.2
  hooks:
    - id: check-github-workflows

# FIXME: See if this local hooks could be replaced with using
# https://github.com/kynan/nbstripout
- repo: local
  hooks:
    - id: cleanipynb-helpers
      name: cleanipynb-helpers
      language: system
      entry: python scripts/cleanipynb.py
      files: notebooks/helpers/[^/]*\.ipynb$

    - id: cleanipynb
      name: cleanipynb
      language: system
      entry: python scripts/cleanipynb.py
      args: [--leave-outputs]
      files: notebooks/[^/]*\.ipynb$
