[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# Check https://flit.readthedocs.io/en/latest/pyproject_toml.html for all available sections
name = "ansys-edb-core"
version = "0.4.0.dev3"
description = "A python wrapper for Ansys Edb service"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ANSYS, Inc.", email = "pyansys.support@ansys.com"}]
maintainers = [{name = "PyAnsys developers", email = "pyansys.maintainers@ansys.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "ansys-api-edb==0.4.dev3",
    "protobuf>=4.25.8,<8",
    "grpcio>=1.44.0",
    "ansys-tools-common>=0.3.1"
]

[project.urls]
Documentation = "https://edb.core.docs.pyansys.com"
Source = "https://github.com/ansys/pyedb-core"
Homepage = "https://github.com/ansys/pyedb-core"
Tracker = "https://github.com/ansys/pyedb-core/issues"

[project.optional-dependencies]
notebook = [
    "notebook",
    "matplotlib",
    "ipynbname"
]
# FIXME: update to newer versions
tests = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "tox",
]
# FIXME: update to newer versions
doc = [
    "sphinx==8.1.3",
    "numpydoc==1.10.0",
    "ansys-sphinx-theme>=0.12.2",
    "sphinx-copybutton==0.5.2",
]

[tool.flit.module]
name = "ansys.edb.core"

[tool.ruff]
line-length = 120
fix = true
# TODO: Add back notebooks and test files
exclude = ["*.def", "*.aedt", "*.aedtz", "*.ipynb"] # Do not check AEDT/EDB binary files, notebooks

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "D",   # pydocstyle, see https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "E",   # pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "F",   # pyflakes, see https://docs.astral.sh/ruff/rules/#pyflakes-f
    "I",   # isort, see https://docs.astral.sh/ruff/rules/#isort-i
    "N",   # pep8-naming, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PTH", # flake8-use-pathlib, https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TD",  # flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
    "W",   # pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "UP006", # non-pep585-annotation, https://docs.astral.sh/ruff/rules/non-pep585-annotation
    "UP007", # non-pep604-annotation-union, https://docs.astral.sh/ruff/rules/non-pep604-annotation-union
    "UP045", # non-pep604-annotation-optional, https://docs.astral.sh/ruff/rules/non-pep604-annotation-optional
]
ignore = [
    # "D" - pydocstyle, see https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D105", # undocumented-magic-method
    "D106", # undocumented-public-nested-class
    "D205", # missing-blank-line-after-summary
    "D210", # surrounding-whitespace
    "D301", # escape-sequence-in-docstring
    "D400", # missing-trailing-period
    "D401", # non-imperative-mood
    "D404", # docstring-starts-with-this
    "D414", # empty-docstring-section
    "D419", # empty-docstring

    # "E" - pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E501", # line-too-long
    "E721", # type-comparison
    "E731", # lambda-assignment
    "E741", # ambiguous-variable-name

    # "F" - pyflakes, see https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F401", # unused-import
    "F405", # undefined-local-with-import-star-usage
    "F811", # redefined-while-unused
    "F821", # undefined-name
    "F841", # unused-variable

    # "N" - pep8-naming, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "N802", # invalid-function-name
    "N803", # invalid-argument-name
    "N806", # non-lowercase-variable-in-function
    "N813", # camelcase-imported-as-lowercase
    "N815", # mixed-case-variable-in-class-scope
    "N816", # mixed-case-variable-in-global-scope
    "N818", # error-suffix-on-exception-name
    "N999", # invalid-module-name

    # "PTH" - flake8-use-pathlib, https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PTH100", # os-path-abspath
    "PTH103", # os-makedirs
    "PTH104", # os-rename
    "PTH106", # os-rmdir
    "PTH107", # os-remove
    "PTH108", # os-unlink
    "PTH110", # os-path-exists
    "PTH112", # os-path-isdir
    "PTH113", # os-path-isfile
    "PTH118", # os-path-join
    "PTH119", # os-path-basename
    "PTH120", # os-path-dirname
    "PTH122", # os-path-splitext
    "PTH123", # builtin-open
    "PTH201", # path-constructor-current-directory
    "PTH208", # os-listdir

    # "TD" - flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
    "TD002", # missing-todo-author
    "TD003", # missing-todo-link

    # "UP" - pyupgrade, https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP007", # non-pep604-annotation-union
]

[tool.ruff.lint.pydocstyle]
# Use Numpy-style docstrings.
convention = "numpy"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["doc", "src/ansys/edb/core", "tests"]
force-single-line = true

[tool.coverage.run]
source = ["ansys.edb"]

[tool.coverage.report]
show_missing = true
