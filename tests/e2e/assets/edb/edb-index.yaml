# Initial asset index for e2e tests.
# Each entry maps a test asset EDB to its metadata.
#
# Schema:
#   - id: unique_identifier
#     path: relative/path/from/this/directory.aedb
#     description: What this EDB contains
#     tags: [tag1, tag2]
#     recipe_id: id_from_edb_design_recipes  # optional, omit only for empty EDBs
#     contains: [ObjectType1, ObjectType2]  # ansys.edb.core class names present in the EDB

assets:
  - id: definition_types
    path: Definition_Types.aedb
    description: Minimal EDB containing exactly one instance of each definition type for unit-testing Database definition-list properties
    tags: [test-fixture, definitions, material, padstack, component, package, dataset, bondwire]
    contains:
      - MaterialDef
      - PadstackDef
      - ComponentDef
      - PackageDef
      - DatasetDef
      - ApdBondwireDef
      - Jedec4BondwireDef
      - Jedec5BondwireDef

  - id: diff_via
    path: Diff_Via.aedb
    description: 12-layer PCB differential via transition with ground return vias, parameterized traces, overlapping stackup, and HFSS simulation setup
    tags: [pcb, differential-via, signal-integrity, via-transition, ground-return-via, 12-layer, hfss, overlapping-stackup, parameterized]
    recipe_id: pcb-differential-via
    contains:
      - Cell
      - PadstackInstance
      - PadstackDef
      - Path
      - Rectangle
      - BundleTerminal
      - HfssSimulationSetup
      - Net
      - NetClass
      - StackupLayer
      - MaterialDef
      - ComponentDef
  - id: ssn
    path: SSN.aedb
    description: 6-layer SSN PCB with mixed RLC/IC/IO components, dense routing and vias, and SIWave simulation setup
    tags: [pcb, ssn, simultaneous-switching-noise, components, rlc, ic, io, power-integrity, 6-layer, laminate, siwave]
    recipe_id: pcb-ssn-components
    contains:
      - Cell
      - PadstackInstance
      - PadstackDef
      - Path
      - Polygon
      - Rectangle
      - Circle
      - PadstackInstanceTerminal
      - PinGroupTerminal
      - ComponentGroup
      - SIWaveSimulationSetup
      - Net
